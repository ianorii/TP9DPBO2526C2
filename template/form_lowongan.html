<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Form Lowongan Pekerjaan</title>
  <!-- Gaya tampilan form tambah dan edit lowongan -->
  <style>
    :root{
      --bg: #f7f8fb;
      --card: #ffffff;
      --muted: #6b7280;
      --accent: #2563eb;
      --border: #e6e9ef;
      --radius: 8px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    html,body{height:100%;margin:0;background:var(--bg);color:#0f172a;}
    .container{max-width:650px;margin:36px auto;padding:18px;}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;box-shadow: 0 1px 3px rgba(16,24,40,0.04);}
    h1{margin:0 0 16px;font-size:20px;color:#0f172a;}
    form{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
    label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:500;}
    input[type="text"], input[type="number"], select{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:6px;font-size:14px;box-sizing:border-box;background:#fff;color:#0f172a;}
    .full{grid-column:1/-1;}
    .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:10px;}
    .btn{padding:9px 16px;border-radius:6px;border:1px solid transparent;font-size:14px;cursor:pointer;text-decoration:none;}
    .btn-primary{background:var(--accent);color:#fff;font-weight:600;}
    .btn-muted{background:transparent;border:1px solid var(--border);color:var(--muted);}
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <!-- Judul form dinamis: Tambah Lowongan Baru / Ubah Data Lowongan -->
      <h1>{{FORM_TITLE}}</h1>

      <!-- Form POST ke index.php?modul=lowongan; token {{ACTION}} bernilai 'tambah' atau 'ubah' -->
      <form method="post" action="index.php?modul=lowongan">
        <input type="hidden" name="modul" value="lowongan">
        <input type="hidden" name="action" value="{{ACTION}}">
        <input type="hidden" name="id" value="{{ID}}">

        <div>
          <label for="posisi">Posisi Lowongan</label>
          <input id="posisi" name="posisi" type="text" placeholder="Misal: Backend Developer" value="{{POSISI}}" required>
        </div>

        <div>
          <label for="departemen">Departemen</label>
          <input id="departemen" name="departemen" type="text" placeholder="Misal: Engineering" value="{{DEPARTEMEN}}" required>
        </div>

        <!-- Pilihan tipe kerja dengan atribut selected diisi oleh ViewLowongan -->
        <div>
          <label for="tipeKerja">Tipe Kerja</label>
          <select id="tipeKerja" name="tipeKerja" required>
            <option value="Full-time" {{TIPE_FULL_TIME}}>Full-time</option>
            <option value="Part-time" {{TIPE_PART_TIME}}>Part-time</option>
            <option value="Internship" {{TIPE_INTERNSHIP}}>Internship</option>
            <option value="Contract" {{TIPE_CONTRACT}}>Contract</option>
          </select>
        </div>

        <div>
          <label for="kuota">Kuota (Orang)</label>
          <input id="kuota" name="kuota" type="number" min="1" step="1" value="{{KUOTA}}" required>
        </div>

        <!-- Pilihan status lowongan dengan atribut selected diisi oleh ViewLowongan -->
        <div class="full">
          <label for="status">Status Lowongan</label>
          <select id="status" name="status" required>
            <option value="Dibuka" {{STATUS_DIBUKA}}>Dibuka</option>
            <option value="Ditutup" {{STATUS_DITUTUP}}>Ditutup</option>
          </select>
        </div>

        <!-- Tombol batal dan simpan -->
        <div class="full actions">
          <a href="index.php?modul=lowongan" class="btn btn-muted">Batal</a>
          <button type="submit" class="btn btn-primary">Simpan</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
